name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 签名密钥不随仓库分发：构建前从 Secrets 还原 keystore.properties 与 jks。
      # 需要配置的 Secrets：KEYSTORE_JKS_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_ALIAS
      - name: Prepare signing config
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_JKS_BASE64" ]; then
            echo "::warning::KEYSTORE_JKS_BASE64 未配置，暂时回退使用仓库内的 keystore（过渡状态）"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_JKS_BASE64" | base64 -d > keystore/rednote.jks
          cat > keystore.properties <<EOF
          keystore.file=keystore/rednote.jks
          keystore.password=${KEYSTORE_PASSWORD}
          keystore.alias=${KEYSTORE_ALIAS:-rednote}
          keystore.key.password=${KEYSTORE_PASSWORD}
          EOF
          echo "签名配置已从 Secrets 注入（alias=${KEYSTORE_ALIAS:-rednote}）"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rednote-lite-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -E '^versionName=' application.properties | cut -d= -f2)
          CODE=$(grep -E '^versionCode=' application.properties | cut -d= -f2)
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RedNote Lite v${{ steps.ver.outputs.name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*.apk
          body: |
            ## 小红书 Lite v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})

            ⚠️ **免责声明**：本项目为第三方非官方客户端，仅供学习与技术研究使用。
            所有内容版权归小红书及原始作者所有。请勿用于商业用途。

            ### 安装
            下载下方 APK 安装即可。需登录小红书账号后使用完整功能。
